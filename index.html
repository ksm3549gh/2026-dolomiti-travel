<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome (Icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f0f9ff; /* Light Sky Blue Background */
        }
        /* Custom Scrollbar for better look */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen shadow-2xl bg-white flex flex-col relative pb-20">

    <!-- App Header -->

            </h1>
            <span class="bg-white/20 text-xs px-2 py-1 rounded-full font-bold backdrop-blur-sm">2인 여행</span>
        </div>
        <p class="text-xs text-white/90 font-medium">2026.07.11(토) ~ 2026.07.22(수)</p>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 p-4 overflow-y-auto" id="main-content">
        
        <!-- PAGE 1: ITINERARY -->
        <section id="page-itinerary" class="app-page">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <span class="w-2.5 h-6 bg-blue-500 rounded-full inline-block"></span>
                    상세 여행 일정
                </h2>
                <span class="text-xs text-slate-500">각 일정을 눌러 상세 정보를 보세요</span>
            </div>

            <!-- Days Accordion Container -->
            <div id="days-container" class="space-y-3">
                <!-- Days will be dynamically generated by JS -->
            </div>
        </section>

        <!-- PAGE 2: CHECKLIST -->
        <section id="page-checklist" class="app-page hidden">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <span class="w-2.5 h-6 bg-teal-400 rounded-full inline-block"></span>
                    여행 체크리스트
                </h2>
            </div>

            <!-- Checklist Add Form -->
            <form id="checklist-form" class="bg-white p-4 rounded-2xl border border-teal-100 shadow-sm mb-4">
                <div class="flex gap-2">
                    <input type="text" id="checklist-input" placeholder="준비물이나 할 일을 입력하세요..." class="flex-1 px-4 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-400" required>
                    <button type="submit" class="bg-teal-400 hover:bg-teal-500 text-white px-4 py-2 rounded-xl text-sm font-bold transition-all flex items-center gap-1">
                        <i class="fa-solid fa-plus"></i> 추가
                    </button>
                </div>
            </form>

            <!-- Checklist List -->
            <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-4">
                <div class="flex justify-between items-center mb-3 text-xs text-slate-500 font-bold border-b pb-2">
                    <span id="checklist-progress">진행도: 0/0 (0%)</span>
                    <button onclick="clearCompletedChecklist()" class="text-rose-500 hover:underline">완료 항목 삭제</button>
                </div>
                <ul id="checklist-ul" class="space-y-3 divide-y divide-slate-50 divide-dashed">
                    <!-- Dynamic Checklist items -->
                </ul>
            </div>
        </section>

        <!-- PAGE 3: BUDGET -->
        <section id="page-budget" class="app-page hidden">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <span class="w-2.5 h-6 bg-emerald-400 rounded-full inline-block"></span>
                    여행 예산 관리
                </h2>
                <span class="text-xs bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-full">환율: €1 = 1,750원</span>
            </div>

            <!-- Budget Input Form -->
            <form id="budget-form" class="bg-white p-4 rounded-2xl border border-emerald-100 shadow-sm mb-4 space-y-3">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs text-slate-500 mb-1 font-bold">항목명</label>
                        <input type="text" id="budget-title" placeholder="예: 첫날 점심식사" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-400" required>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-500 mb-1 font-bold">구분</label>
                        <select id="budget-category" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-emerald-400">
                            <option value="식비">🍔 식비</option>
                            <option value="교통/주유">🚗 교통/주유</option>
                            <option value="액티비티">🚠 액티비티/케이블카</option>
                            <option value="숙박">🏨 숙박</option>
                            <option value="기타">🛍️ 기타</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2 items-end">
                    <div class="col-span-2">
                        <label class="block text-xs text-slate-500 mb-1 font-bold">금액 입력</label>
                        <input type="number" id="budget-amount" placeholder="숫자만 입력" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-400" required>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-500 mb-1 font-bold">통화</label>
                        <select id="budget-currency" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-emerald-400">
                            <option value="EUR">EUR (€)</option>
                            <option value="KRW">KRW (₩)</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="w-full bg-emerald-400 hover:bg-emerald-500 text-white py-2 rounded-xl text-xs font-bold transition-all flex justify-center items-center gap-1">
                    <i class="fa-solid fa-plus"></i> 예산 항목 추가
                </button>
            </form>

            <div class="bg-gradient-to-br from-emerald-500 to-teal-500 text-white rounded-2xl p-4 shadow-md mb-4 flex justify-between items-center">

                </div>
                <div class="text-right border-l border-white/20 pl-4">
                    <p class="text-xs text-white/80 font-bold">유로화 합계</p>
                    <p class="text-lg font-bold" id="total-eur">€ 0</p>
                </div>
            </div>

                <p class="text-xs font-bold text-slate-700 mb-2">세부 지출 목록</p>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-100 text-[11px] text-slate-400 font-bold">
                                <th class="pb-2">구분</th>
                                <th class="pb-2">항목명</th>
                                <th class="pb-2 text-right">입력금액</th>
                                <th class="pb-2 text-right">원화환산(₩)</th>
                                <th class="pb-2 text-center">삭제</th>
                            </tr>
                        </thead>
                        <tbody id="budget-tbody" class="divide-y divide-slate-50 text-xs">

                        </tbody>

            <i class="fa-solid fa-route text-lg"></i>
            <span class="text-[10px]">여행계획</span>

            <i class="fa-solid fa-list-check text-lg"></i>
            <span class="text-[10px]">체크리스트</span>
        </button>
        <button id="btn-budget" onclick="switchPage('budget')" class="flex flex-col items-center gap-1 text-slate-400 font-medium transition-all">
            <i class="fa-solid fa-wallet text-lg"></i>
            <span class="text-[10px]">예산관리</span>

    </nav>

            <div class="flex justify-between items-center">
                <h3 class="font-bold text-slate-800" id="memo-modal-title">일정 메모</h3>
                <button onclick="closeMemoModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <input type="hidden" id="memo-day-index">
            <input type="hidden" id="memo-item-index">
            <textarea id="memo-textarea" rows="4" class="w-full p-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="메모할 내용을 적어주세요..."></textarea>
            <div class="flex gap-2">

            </div>
        </div>
    </div>

        function renderItinerary() {
            const container = document.getElementById('days-container');
            container.innerHTML = '';

            travelData.forEach((dayData, index) => {
                // Combine original memos and custom added memos
                const mergedMemos = [...dayData.memos, ...(customMemos[index] || [])];
                
                const dayCard = document.createElement('div');
                dayCard.className = "bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden transition-all duration-300";
                
                let liftButtonsHtml = '';
                if(dayData.lifts.length > 0) {
                    dayData.lifts.forEach(lift => {
                        liftButtonsHtml += `
                            <a href="${lift.url}" target="_blank" class="inline-flex items-center gap-1.5 bg-blue-50 text-blue-600 hover:bg-blue-100 px-3 py-1.5 rounded-xl text-xs font-bold transition-all mt-2 mr-2 border border-blue-100">
                                <i class="fa-solid fa-circle-info"></i> ${lift.name} 실시간 운행정보 ↗
                            </a>
                        `;
                    });
                }

                let memosHtml = '';
                mergedMemos.forEach((memo, mIdx) => {
                    memosHtml += `
                        <div class="flex items-start justify-between bg-amber-50/50 p-2.5 rounded-xl text-xs text-amber-900 border border-amber-100/40 gap-2">
                            <span class="flex-1 leading-relaxed"><i class="fa-solid fa-thumbtack text-amber-500 mr-1.5"></i>${memo}</span>
                            <div class="flex gap-1.5">
                                <button onclick="openMemoModalForEdit(${index}, ${mIdx}, '${memo.replace(/'/g, "\\'")}')" class="text-blue-500 hover:text-blue-700 text-[10px]"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="deleteDayMemo(${index}, ${mIdx})" class="text-rose-500 hover:text-rose-700 text-[10px]"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        </div>
                    `;
                });

                let timelineHtml = '';
                dayData.timeline.forEach((item, tIdx) => {
                    const isLast = tIdx === dayData.timeline.length - 1;
                    timelineHtml += `
                        <div class="flex gap-3 relative text-xs">
                            ${!isLast ? '<div class="absolute left-[13px] top-[14px] bottom-[-16px] w-[1px] bg-slate-200"></div>' : ''}
                            <span class="font-bold text-blue-500 w-10 text-right shrink-0 pt-0.5">${item.time}</span>
                            <div class="w-2.5 h-2.5 rounded-full bg-teal-400 mt-[5px] shrink-0 outline outline-4 outline-teal-50"></div>
                            <span class="text-slate-600 leading-relaxed pb-4 flex-1">${item.desc}</span>
                        </div>
                    `;
                });

                dayCard.innerHTML = `
                    <!-- Accordion Header -->
                    <div class="p-4 flex justify-between items-center cursor-pointer bg-gradient-to-r from-slate-50 to-white hover:from-blue-50/20" onclick="toggleAccordion('day-content-${index}')">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="bg-blue-500 text-white text-[10px] font-black px-2 py-0.5 rounded-md">DAY ${dayData.day}</span>
                                <span class="text-[11px] text-slate-400 font-bold">${dayData.date}</span>
                            </div>
                            <h3 class="font-bold text-slate-800 text-sm">${dayData.title}</h3>
                        </div>
                        <i class="fa-solid fa-chevron-down text-slate-400 transition-transform duration-300" id="icon-day-content-${index}"></i>
                    </div>

                    <!-- Accordion Body (Initially hidden except DAY 2 for preview) -->
                    <div id="day-content-${index}" class="border-t border-slate-50 p-4 space-y-4 ${index === 1 ? '' : 'hidden'}">
                        <!-- Key Information -->
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <div class="bg-blue-50/50 p-2.5 rounded-xl border border-blue-100/30">
                                <p class="text-[10px] text-slate-400 font-bold mb-0.5"><i class="fa-solid fa-hotel text-blue-500"></i> 숙박지</p>
                                <p class="font-bold text-slate-700 leading-tight">${dayData.hotel}</p>
                            </div>
                            <div class="bg-teal-50/50 p-2.5 rounded-xl border border-teal-100/30">
                                <p class="text-[10px] text-slate-400 font-bold mb-0.5"><i class="fa-solid fa-utensils text-teal-400"></i> 추천 점심</p>
                                <p class="font-bold text-slate-700 leading-tight">${dayData.lunch}</p>
                            </div>
                        </div>

                        <!-- Lifts Real-time Information Link -->
                        ${liftButtonsHtml ? `<div>${liftButtonsHtml}</div>` : ''}

                        <!-- Google Map Path button -->
                        <div>
                            <a href="${dayData.routeUrl}" target="_blank" class="w-full flex items-center justify-center gap-1.5 bg-slate-800 hover:bg-slate-900 text-white py-2 rounded-xl text-xs font-bold transition-all shadow-sm">
                                <i class="fa-solid fa-map-location-dot text-emerald-400"></i> 전체 구글 지도 경로 확인 (동선 순서 기준) ↗
                            </a>
                        </div>

                        <!-- Memos Block -->
                        <div class="space-y-2">
                            <div class="flex justify-between items-center">
                                <span class="text-xs font-bold text-slate-800"><i class="fa-solid fa-note-sticky text-amber-500"></i> 오늘의 알림 & 자유 메모</span>
                                <button onclick="openMemoModal(${index})" class="text-[11px] text-blue-500 font-bold flex items-center gap-0.5 hover:underline">
                                    <i class="fa-solid fa-plus-circle"></i> 새 메모 추가
                                </button>
                            </div>
                            <div class="space-y-1.5">
                                ${memosHtml || '<p class="text-xs text-slate-400 py-2 text-center">등록된 메모가 없습니다.</p>'}
                            </div>
                        </div>

                        <!-- Timeline Sequence -->
                        <div class="pt-2">
                            <p class="text-xs font-bold text-slate-800 mb-3"><i class="fa-solid fa-clock-rotate-left text-teal-400"></i> 타임라인 일정순서 (동선 번호 포함)</p>
                            <div class="pl-2">
                                ${timelineHtml}
                            </div>
                        </div>
                    </div>
                `;

                container.appendChild(dayCard);
            });
        }

        // Toggle Accordion function
        function toggleAccordion(id) {
            const target = document.getElementById(id);
            const icon = document.getElementById(`icon-${id}`);
            if (target.classList.contains('hidden')) {
                target.classList.remove('hidden');
                icon.classList.add('rotate-180');
            } else {
                target.classList.add('hidden');
                icon.classList.remove('rotate-180');
            }
        }

        // Switching Active Page
        function switchPage(pageName) {
            document.querySelectorAll('.app-page').forEach(page => page.classList.add('hidden'));
            document.getElementById(`page-${pageName}`).classList.remove('hidden');

            // Button styling reset and update
            const navButtons = {
                itinerary: document.getElementById('btn-itinerary'),
                checklist: document.getElementById('btn-checklist'),
                budget: document.getElementById('btn-budget')
            };

            Object.keys(navButtons).forEach(key => {
                const btn = navButtons[key];
                if (key === pageName) {
                    btn.classList.add('text-blue-500', 'font-bold');
                    btn.classList.remove('text-slate-400', 'font-medium');
                } else {
                    btn.classList.remove('text-blue-500', 'font-bold');
                    btn.classList.add('text-slate-400', 'font-medium');
                }
            });

            // Auto scroll to top of page when navigating
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 2. Checklist Screen Logic
        const checklistForm = document.getElementById('checklist-form');
        const checklistInput = document.getElementById('checklist-input');
        const checklistUl = document.getElementById('checklist-ul');

        checklistForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const text = checklistInput.value.trim();
            if(!text) return;
            
            checklist.push({
                id: Date.now(),
                text: text,
                done: false
            });
            checklistInput.value = '';
            saveState();
            renderChecklist();
        });

        function renderChecklist() {
            checklistUl.innerHTML = '';
            if(checklist.length === 0) {
                checklistUl.innerHTML = '<li class="text-xs text-slate-400 py-4 text-center">체크리스트가 비어있습니다.</li>';
                document.getElementById('checklist-progress').innerText = "진행도: 0/0 (0%)";
                return;
            }

            let completedCount = 0;
            checklist.forEach(item => {
                if(item.done) completedCount++;
                const li = document.createElement('li');
                li.className = "flex justify-between items-center py-2.5 first:pt-0";
                li.innerHTML = `
                    <div class="flex items-center gap-3 cursor-pointer flex-1" onclick="toggleChecklistDone(${item.id})">
                        <i class="fa-regular ${item.done ? 'fa-circle-check text-teal-400' : 'fa-circle text-slate-300'} text-lg"></i>
                        <span class="text-xs ${item.done ? 'line-through text-slate-400 font-normal' : 'text-slate-700 font-medium'} leading-relaxed">${item.text}</span>
                    </div>
                    <button onclick="deleteChecklistItem(${item.id})" class="text-rose-400 hover:text-rose-600 px-1 py-1 text-xs transition-all"><i class="fa-solid fa-trash-can"></i></button>
                `;
                checklistUl.appendChild(li);
            });

            const percent = Math.round((completedCount / checklist.length) * 100);
            document.getElementById('checklist-progress').innerText = `진행도: ${completedCount}/${checklist.length}개 (${percent}%)`;
        }

        function toggleChecklistDone(id) {
            checklist = checklist.map(item => item.id === id ? { ...item, done: !item.done } : item);
            saveState();
            renderChecklist();
        }

        function deleteChecklistItem(id) {
            checklist = checklist.filter(item => item.id !== id);
            saveState();
            renderChecklist();
        }

        function clearCompletedChecklist() {
            checklist = checklist.filter(item => !item.done);
            saveState();
            renderChecklist();
        }

        // 3. Budget Screen Logic
        const budgetForm = document.getElementById('budget-form');
        const budgetTitleInput = document.getElementById('budget-title');
        const budgetCategorySelect = document.getElementById('budget-category');
        const budgetAmountInput = document.getElementById('budget-amount');
        const budgetCurrencySelect = document.getElementById('budget-currency');
        const budgetTbody = document.getElementById('budget-tbody');

        budgetForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const title = budgetTitleInput.value.trim();
            const category = budgetCategorySelect.value;
            const amount = parseFloat(budgetAmountInput.value);
            const currency = budgetCurrencySelect.value;

            if(!title || isNaN(amount)) return;

            budgets.push({
                id: Date.now(),
                title: title,
                category: category,
                amount: amount,
                currency: currency
            });

            // Reset Form Inputs
            budgetTitleInput.value = '';
            budgetAmountInput.value = '';
            saveState();
            renderBudget();
        });

        function renderBudget() {
            budgetTbody.innerHTML = '';
            let totalKrwVal = 0;
            let totalEurVal = 0;

            budgets.forEach(item => {
                let krwAmount = 0;
                let eurAmount = 0;

                if (item.currency === 'EUR') {
                    eurAmount = item.amount;
                    krwAmount = item.amount * EXCHANGE_RATE;
                } else {
                    krwAmount = item.amount;
                    eurAmount = item.amount / EXCHANGE_RATE;
                }

                totalKrwVal += krwAmount;
                totalEurVal += eurAmount;

                const tr = document.createElement('tr');
                tr.className = "border-b border-slate-50 hover:bg-slate-50/50";
                tr.innerHTML = `
                    <td class="py-2.5 font-medium text-slate-500">${item.category}</td>
                    <td class="py-2.5 font-bold text-slate-800">${item.title}</td>
                    <td class="py-2.5 text-right font-medium text-slate-700">${item.currency === 'EUR' ? '€' : '₩'}${item.amount.toLocaleString()}</td>
                    <td class="py-2.5 text-right text-emerald-600 font-bold">₩${Math.round(krwAmount).toLocaleString()}</td>
                    <td class="py-2.5 text-center">
                        <button onclick="deleteBudget(${item.id})" class="text-rose-400 hover:text-rose-600 text-xs px-1.5 py-0.5"><i class="fa-solid fa-trash-can"></i></button>
                    </td>
                `;
                budgetTbody.appendChild(tr);
            });

            document.getElementById('total-krw').innerText = `${Math.round(totalKrwVal).toLocaleString()} 원`;
            document.getElementById('total-eur').innerText = `€ ${Math.round(totalEurVal).toLocaleString()}`;
        }

        function deleteBudget(id) {
            budgets = budgets.filter(item => item.id !== id);
            saveState();
            renderBudget();
        }

        // 4. Memos Modal Logic
        const memoModal = document.getElementById('memo-modal');
        const memoModalTitle = document.getElementById('memo-modal-title');
        const memoDayIndex = document.getElementById('memo-day-index');
        const memoItemIndex = document.getElementById('memo-item-index');
        const memoTextarea = document.getElementById('memo-textarea');
        const btnMemoDelete = document.getElementById('btn-memo-delete');

        function openMemoModal(dayIdx) {
            memoModalTitle.innerText = `DAY ${dayIdx + 1} 메모 추가`;
            memoDayIndex.value = dayIdx;
            memoItemIndex.value = -1; // -1 means adding new
            memoTextarea.value = '';
            btnMemoDelete.classList.add('hidden');
            memoModal.classList.remove('hidden');
        }

        function openMemoModalForEdit(dayIdx, mIdx, memoText) {
            memoModalTitle.innerText = `DAY ${dayIdx + 1} 메모 수정`;
            memoDayIndex.value = dayIdx;
            memoItemIndex.value = mIdx;
            memoTextarea.value = memoText;
            btnMemoDelete.classList.remove('hidden');
            memoModal.classList.remove('hidden');
        }

        function closeMemoModal() {
            memoModal.classList.add('hidden');
        }

        function saveMemo() {
            const dayIdx = parseInt(memoDayIndex.value);
            const mIdx = parseInt(memoItemIndex.value);
            const text = memoTextarea.value.trim();

            if(!text) return;

            if(!customMemos[dayIdx]) {
                customMemos[dayIdx] = [];
            }

            if(mIdx === -1) {
                // Add new memo
                customMemos[dayIdx].push(text);
            } else {
                // Edit existing custom memo
                // Note: In travelData there are static memos, we handle custom ones separately or allow editing custom ones
                customMemos[dayIdx][mIdx] = text;
            }

            saveState();
            renderItinerary();
            closeMemoModal();
        }

        function deleteMemo() {
            const dayIdx = parseInt(memoDayIndex.value);
            const mIdx = parseInt(memoItemIndex.value);
            if(dayIdx >= 0 && mIdx >= 0) {
                customMemos[dayIdx].splice(mIdx, 1);
                saveState();
                renderItinerary();
                closeMemoModal();
            }
        }

        // Direct delete of day custom memo
        function deleteDayMemo(dayIdx, mIdx) {
            // First check if it is part of static memos or custom memos
            const staticLength = travelData[dayIdx].memos.length;
            if (mIdx < staticLength) {
                // If trying to delete pre-written static memos, we can save a copy to customMemos and hide it
                // For simplicity, we warn that static memos can't be deleted but can be overwritten. 
                // However, let's treat all memos smoothly:
                const confirmRes = confirm("일정 기본 알림 메모를 삭제하시겠습니까?");
                if(confirmRes) {
                    travelData[dayIdx].memos.splice(mIdx, 1);
                    renderItinerary();
                }
            } else {
                // Delete custom memo
                const customIdx = mIdx - staticLength;
                customMemos[dayIdx].splice(customIdx, 1);
                saveState();
                renderItinerary();
            }
        }

        // Run application on load
        window.onload = function() {
            initApp();
        };
    </script>
</body>
</html>
